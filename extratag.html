<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extra Tag</title>
</head>
<body>
    <!-- Abbreviation <abbr> digunakan ketika dibaca menjadi per huruf -->
    <p>Saat ini kita sedang berada di <abbr title="Lembaga Kursus dan Pelatihan">LKP</abbr> Indo Jaya</p>

    <!-- Acronym <acronym> digunakan ketika dibaca menjadi per kata -->
    <p>Lahan kosong di pinggir kuburan tersebut dibangun sebuah <acronym title="Koperasi Desa">KOPDES</acronym></p>

    <!-- Insert dan Delete -->
     <p>Saya sangat <del>menolak</del> <ins>mendukung</ins> kebijakan pemerintah</p>
</body>
</html>
